<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChainKYC — Blockchain-Based Reusable KYC Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;background:#0a0e17;color:#e2e8f0;min-height:100vh;font-family:system-ui,sans-serif;">
    <div id="root" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;box-sizing:border-box;">
      <p style="color:#14b8a6;font-size:1.5rem;font-weight:600;">ChainKYC</p>
      <p id="load-msg" style="color:#94a3b8;font-size:0.95rem;">Loading…</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      setTimeout(function(){
        var msg = document.getElementById('load-msg');
        var root = document.getElementById('root');
        if (msg && msg.textContent.indexOf('Loading') !== -1 && root && root.children.length <= 2) {
          msg.innerHTML = 'App did not start. Run in terminal: <code style="background:#1e293b;padding:2px 6px;border-radius:4px;">cd frontend && npm run dev</code> then open <strong>http://localhost:3000</strong> in this browser.';
          msg.style.maxWidth = '480px';
          msg.style.textAlign = 'center';
        }
      }, 4000);
    </script>
  </body>
</html>
